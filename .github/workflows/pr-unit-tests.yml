name: PR Unit Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.3'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test
